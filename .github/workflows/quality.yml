name: AirGuard quality gates
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m scripts.check_public_exports
      # A generated artefact that names D:\... or /Users/<name>/... leaks the
      # operator's machine and cannot be reproduced elsewhere. Fail, never fix.
      - run: python -m scripts.check_generated_paths
      - run: npm ci
        working-directory: webapp
      - run: npm test && npm run typecheck && npm run lint && npm run build
        working-directory: webapp
      - run: npm audit --audit-level=high
        working-directory: webapp

# No deployment or database credentials are exposed to PR code. Live database
# rollback tests skip when DATABASE_URL is absent; run them locally before release.
# This file is prepared; no Git remote is configured in this checkout.
