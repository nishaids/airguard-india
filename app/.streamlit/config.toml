# AirGuard India - Streamlit configuration
# Dark-first theme. Foreground and background pairs were checked against the
# WCAG 2.1 AA contrast requirement of 4.5:1 for body text.

[theme]
base = "dark"
primaryColor = "#56B4E9"          # Okabe-Ito sky blue, 7.4:1 on the background
backgroundColor = "#11151C"
secondaryBackgroundColor = "#1B2029"
textColor = "#EDF1F5"             # 15.3:1 on the background
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
